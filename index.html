<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReSorter</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>ReSorter</h1>
    <p>Kharosa has mixed up the world. Help sort it back into order.</p>

    <!-- The playing field: all bottles. Each bottle lists its layers from TOP to BOTTOM. -->
    <div class="bottles">

      <div class="bottle">
        <div class="bottle-inside">
          <div class="layer colour-2"></div>
          <div class="layer colour-1"></div>
          <div class="layer colour-3"></div>
          <div class="layer colour-4"></div>
        </div>
      </div>

      <div class="bottle">
        <div class="bottle-inside">
          <div class="layer colour-4"></div>
          <div class="layer colour-3"></div>
          <div class="layer colour-1"></div>
          <div class="layer colour-2"></div>
        </div>
      </div>

      <div class="bottle">
        <div class="bottle-inside">
          <div class="layer colour-1"></div>
          <div class="layer colour-2"></div>
          <div class="layer colour-3"></div>
          <div class="layer colour-4"></div>
        </div>
      </div>

      <div class="bottle">
        <div class="bottle-inside">
          <div class="layer colour-3"></div>
          <div class="layer colour-4"></div>
          <div class="layer colour-2"></div>
          <div class="layer colour-1"></div>
        </div>
      </div>

      <!-- Three empty bottles, so there is room to sort -->
      <div class="bottle">
        <div class="bottle-inside"></div>
      </div>

      <div class="bottle">
        <div class="bottle-inside"></div>
      </div>

      <div class="bottle">
        <div class="bottle-inside"></div>
      </div>

    </div>

    <!-- The game rules and data, in JavaScript. At the end, so the page is loaded first. -->
    <script src="game.js"></script>
  </body>
</html>
