<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReSorter</title>
    <!-- The theme: all colours (theme-liquid.css). Then the look that uses them (style.css). -->
    <link rel="stylesheet" href="theme-liquid.css">
    <link rel="stylesheet" href="theme-attic.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>ReSorter</h1>
    <p>Kharosa has mixed up the world. Help sort it back into order.</p>

    <!-- The main buttons. They are always here, in the same place, above the bottles. -->
    <div class="controls">
      <button type="button" class="control-button" id="undo-button">Undo</button>
      <button type="button" class="control-button" id="restart-button">Restart</button>
    </div>

    <!-- The difficulty: a select menu (a drop-down list). Each <option> has a value for the code
         (it must match a name in "difficulties" in game.js) and a text for the player. -->
    <div class="settings">
      <span class="setting">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty" class="control-select" autocomplete="off">
          <option value="path">Level path</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </span>
      <span class="setting">
        <label for="look">Look</label>
        <select id="look" class="control-select" autocomplete="off">
          <option value="liquid">Bottles</option>
          <option value="attic">Attic boxes</option>
        </select>
      </span>
    </div>

    <!-- The playing field. It starts empty: draw.js fills it with bottles from the data in game.js. -->
    <div class="bottles" id="bottles"></div>

    <!-- Messages for the player, for example when a pour is not allowed.
         aria-live: screen readers read a new message aloud. -->
    <p class="message" id="message" aria-live="polite"></p>

    <!-- Only for screen readers (hidden on screen): says what each pour did. -->
    <p class="screen-reader-only" id="announce" aria-live="polite"></p>

    <!-- The move counter and the number of levels won. -->
    <p class="stats" id="stats"></p>

    <!-- Forget everything the game saved in this browser (privacy: the player decides). -->
    <div class="footer">
      <button type="button" class="control-button small-button" id="reset-progress">Reset progress</button>
    </div>

    <!-- The colour-blind switch: always at the bottom of the screen. It says On or Off in words,
         so you never need to see a colour to know its state. role="switch" tells screen readers
         it is an on/off switch; aria-checked says if it is on. -->
    <div class="access-bar">
      <button type="button" id="symbols-switch" class="toggle" role="switch" aria-checked="false">
        <span class="toggle-track" aria-hidden="true"><span class="toggle-knob"></span></span>
        <span class="toggle-text">Colour-blind symbols: <strong id="symbols-state">Off</strong></span>
      </button>
    </div>

    <!-- JavaScript, at the end so the page is loaded first.
         game.js = the data and rules. save.js = saving in your own browser. attic.js = the attic look. draw.js = puts them on the screen. pour.js = the pour animation. sparkle.js = stopper and firework. -->
    <script src="game.js"></script>
    <script src="save.js"></script>
    <script src="attic.js"></script>
    <script src="draw.js"></script>
    <script src="pour.js"></script>
    <script src="sparkle.js"></script>
  </body>
</html>
